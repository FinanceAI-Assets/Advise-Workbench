# Tool settings only. Dependencies are pinned in requirements.txt / requirements-dev.txt.
# The code is imported as the `src` package from the repo root (no install step needed).

[project]
name = "my-fastapi-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "anthropic==0.125.0",
    "bcrypt==4.0.1",
    "cairosvg==2.9.1",
    "faiss-cpu==1.15.1",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "langfuse==4.16.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph==1.2.13",
    "networkx==3.6.1",
    "openpyxl==3.1.5",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "orjson==3.12.0",
    "passlib[bcrypt]==1.7.4",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "python-pptx==1.0.2",
    "pyyaml==6.0.3",
    "redis==7.4.1",
    "reportlab==5.0.1",
    "sentence-transformers==5.7.0",
    "slowapi==0.1.10",
    "sqlalchemy==2.1.2",
    "uvicorn[standard]==0.54.0",
    "xlrd==2.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "slow: longer integration-style tests (minutes / heavy I/O); exclude with -m \"not slow\"",
    "live_llm: requires real Anthropic API; opt-in only",
    "redis: exercises real Redis-backed code paths via fakeredis; opt-in only",
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 0

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "S"]
ignore = [
  "S101",   # assert statements (used in tests)
  "S105",   # hardcoded passwords (false positives on config defaults)
  "S106",
  "S603",   # subprocess without shell=False (we do validate inputs)
  "B008",   # do not perform function calls in argument defaults (FastAPI Depends pattern)
  "SIM108", # use ternary operator (readability preference)
  "SIM105", # prefer contextlib.suppress (try/except/pass is equally valid; keeps local scope)
  "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# main.py loads .env files BEFORE importing app modules so Settings()
# observes the final env-var state; that legitimately requires imports after code.
"src/app/main.py" = ["E402"]
# Tests frequently use assert statements, hardcoded creds, and deliberate bare
# `raise` patterns that are harmless in a test context.
"tests/*" = ["S101", "S105", "S106", "S107", "S108", "S110", "S112", "S311", "S324", "B017", "F841", "E741", "SIM105", "SIM117"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
allow_untyped_defs = true
warn_unused_ignores = false
