# Optional only: Postgres + Redis for developers who want containers.
# Local-first setup uses SQLite + in-process cache; you can ignore this file.
version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: advise_workbench
      POSTGRES_PASSWORD: advise_workbench
      POSTGRES_DB: advise_workbench
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Optional: diagrams.net (draw.io) self-hosted editor for collaboration (embed=1, proto=json).
  # This does not remove the need for the backend websocket collaboration endpoints;
  # it only provides the diagram editor runtime.
  #
  # After starting:
  # - HTTP:  http://localhost:8081
  # - HTTPS: https://localhost:8444
  #
  # Note: your browser may warn about the self-signed certificate.
  drawio:
    image: jgraph/drawio
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "8444:8443"
    environment:
      # Keep it simple for local dev; use the container's self-signed cert.
      LETS_ENCRYPT_ENABLED: "false"
      PUBLIC_DNS: "localhost"
      ORGANISATION_UNIT: "dev"
      ORGANISATION: "advise_workbench"
      CITY: "local"
      STATE: "local"
      COUNTRY_CODE: "US"
      # Ensure self-hosted URLs work correctly in iframe/embed mode.
      # - DRAWIO_SERVER_URL must end with `/`
      # - DRAWIO_LIGHTBOX_URL should differ from DRAWIO_BASE_URL; trailing `/.` is the documented workaround.
      DRAWIO_SERVER_URL: "https://localhost:8444/"
      DRAWIO_BASE_URL: "https://localhost:8444"
      DRAWIO_LIGHTBOX_URL: "https://localhost:8444/."
      DRAWIO_VIEWER_URL: "https://localhost:8444/js/viewer.min.js"

  # ============================================================================
  # Stage 1.1: SeaweedFS - Distributed Document Storage
  # ============================================================================
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master
    command: master -ip=seaweedfs-master -mdir=/data -port=9333
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs-master-data:/data
    environment:
      WEED_GOMAXPROCS: "4"
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:9333/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  seaweedfs-volume-1:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume-1
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume-1 -port=8080 -dir=/data -max=0
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - seaweedfs-volume-1-data:/data
    environment:
      WEED_GOMAXPROCS: "4"
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  seaweedfs-volume-2:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume-2
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume-2 -port=8081 -dir=/data -max=0
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - seaweedfs-volume-2-data:/data
    environment:
      WEED_GOMAXPROCS: "4"
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8081/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  seaweedfs-volume-3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume-3
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume-3 -port=8082 -dir=/data -max=0
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - seaweedfs-volume-3-data:/data
    environment:
      WEED_GOMAXPROCS: "4"
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8082/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    command: filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -port=8888 -dir=/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs-filer-data:/data
    environment:
      WEED_GOMAXPROCS: "4"
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  seaweedfs-master-data:
  seaweedfs-volume-1-data:
  seaweedfs-volume-2-data:
  seaweedfs-volume-3-data:
  seaweedfs-filer-data:
