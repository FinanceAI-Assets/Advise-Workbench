name: sop_user
version: "1.0.0"
description: User prompt for generating Standard Operating Procedure documents (legacy agent)
system: null
user: |
  Write a Standard Operating Procedure (SOP) from the ProcessModel below.

  Document structure — use EXACTLY these sections in this order:
  1. `# <process_name>` — H1 title only, no subtitle
  2. `## Purpose` — 1–3 sentences: what problem this process solves and who benefits
  3. `## Scope` — 1–2 sentences: what is covered and what is explicitly out of scope
  4. `## Roles` — bulleted list of each role in ProcessModel.roles with a one-sentence description of their mandate in this process
  5. `## Procedure` — numbered list where each item corresponds to exactly one ProcessModel step; format: `N. **<step.name>** _(role: <step.role>)_` followed by a sub-list of inputs/outputs/tools if any are present in the step; do not add steps not in the ProcessModel
  6. `## Decision Points` — include only if ProcessModel.decisions is non-empty; for each decision: `**<condition>** → Yes: <true_path step names>, No: <false_path step names>`; omit this section entirely if decisions is []
  7. `## References` — single bullet: 'Source: run instruction and assembled project context'

  Length constraint: ≤80 words per section (Purpose, Scope). Procedure steps: ≤20 words per step name line.
  Do not add sections beyond the seven listed above.

  ${process_model}
