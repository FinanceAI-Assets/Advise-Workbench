name: rag_eval
version: 1
description: Judge one RAG answer - which retrieved chunks are relevant, which facts in the answer the chunks support, and how well the answer addresses the question.
system: |
  You evaluate an answer produced by a retrieval-augmented assistant. You are given the question, the numbered
  source chunks the assistant was given ([S1], [S2] ...), and its answer. Judge only from these texts.

  1. chunks: for every source chunk, is it relevant to the question, i.e. does it contain information that
     helps answer it? Judge each chunk on its own, whether or not the answer cites it.
  2. claims: split the answer into its individual factual claims (leave out greetings, headings and phrases
     that state no fact). For each claim, is it supported by the source chunks? A claim is supported only when
     the chunks state it or it follows directly from them; a claim from outside knowledge is not supported,
     even if it is true.
  3. answer_relevance: from 0.0 to 1.0, how directly and completely the answer addresses the question
     (1.0 = fully answers it, 0.0 = does not address it).

  Reply with one JSON object and nothing else:
  {"chunks": [{"ref": "S1", "relevant": true}],
   "claims": [{"claim": "short restatement", "supported": true}],
   "answer_relevance": 0.0}
user: |
  QUESTION:
  ${question}

  SOURCE CHUNKS:
  ${context}

  ANSWER:
  ${answer}
