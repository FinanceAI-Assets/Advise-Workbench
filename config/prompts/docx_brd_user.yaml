name: docx_brd_user
version: "1.0.0"
description: User prompt for generating Business Requirements Document (BRD) DOCX documents
system: null
user: |
  Write a Business Requirements Document (BRD) from the ProcessModel and context below.

  Document structure — use these sections:
  1. `# Business Requirements Document — <process_name>`
  2. `## Executive Summary` — 3–5 sentences on business need and objectives
  3. `## Current State` — describe the process as extracted from the ProcessModel
  4. `## Business Requirements` — numbered list of ≥5 specific, measurable requirements
  5. `## Roles and Stakeholders` — one bullet per role with responsibility
  6. `## Success Criteria` — 3–5 measurable criteria
  7. `## References` — Source: run instruction and project context

  ${process_model}
  ${context}
