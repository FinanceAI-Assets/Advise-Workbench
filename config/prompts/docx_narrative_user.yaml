name: docx_narrative_user
version: "1.0.0"
description: User prompt for generating executive briefing narrative DOCX documents
system: null
user: |
  Write an executive briefing note from the ProcessModel and context excerpt below.

  Document structure — use EXACTLY these sections in this order:
  1. `# <process_name> — Executive Briefing` — H1 title
  2. `## What This Process Does` — 2–4 sentences: business outcome, who initiates it, who benefits
  3. `## Key Activities` — ≤6 bulleted items naming activity and owner role in ≤12 words each
  4. `## Roles and Accountability` — one bullet per role in ≤15 words
  5. `## Recommended Next Actions` — exactly 2–4 numbered items, ≤20 words each, specific to this process

  Constraints: no hedging language; no 'Context Used' section; no section repetition.

  ${process_model}
  ${context}
